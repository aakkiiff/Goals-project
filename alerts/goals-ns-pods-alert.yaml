apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    release: test1 # change to your release name, must match the release name of your Prometheus operator
  name: kube-pod-not-ready
  namespace: goals-ns   #important: must match the namespace where you want alerting
spec:
  groups:
  - name: goals-pods-alerts
    rules:
    - alert: KubernetesPodNotHealthy
      expr: sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0
      for: 20s # adjust the duration as needed
      labels:
        name: akif
        severity: critical
      annotations:
        summary: Kubernetes Pod {{ $labels.pod }} not healthy 
        description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-running state for longer than 15 minutes.\n"     

    - alert: KubernetesPodCrashLooping
      expr: increase(kube_pod_container_status_restarts_total[1m]) > 3
      for: 20s  #adjust the duration as needed
      labels:
        severity: critical
      annotations:
        summary: Kubernetes pod {{ $labels.pod }} crash looping
        description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping\n"


    - alert: ContainerHighCpuUtilization
      expr: (sum(rate(container_cpu_usage_seconds_total{container!=""}[1m])) by (pod, container) / sum(container_spec_cpu_quota{container!=""}/container_spec_cpu_period{container!=""}) by (pod, container) * 100) > 60
      for: 30s
      labels:
        severity: warning
      annotations:
        summary: Container High CPU utilization
        description: "Container CPU utilization is above 80%\n"

    - alert: ContainerHighMemoryUsage
      expr: (sum(container_memory_working_set_bytes{name!=""}) BY (instance, name) / sum(container_spec_memory_limit_bytes > 0) BY (instance, name) * 100) > 80
      for: 30s
      labels:
        severity: warning
      annotations:
        summary: Container High Memory usage
        description: "Container Memory usage is above 80%\n"

    - alert: KubernetesContainerOomKiller
      expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: Kubernetes Container oom killer
        description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.\n"

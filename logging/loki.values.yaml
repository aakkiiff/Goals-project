# https://artifacthub.io/packages/helm/grafana/loki

# Deployment mode: SingleBinary (simple), SimpleScalable (medium), Distributed (large)
deploymentMode: SingleBinary

# Number of replicas
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi  # Add a size (required for dynamic provisioning; adjust as needed)
    storageClass: "nfs-client"  # Or local-path-storage if that's your exact name
# Component replicas
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

# Caching
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Helm test
test:
  enabled: false

# All loki settings combined under one key
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem

  useTestSchema: true

  persistence:
    enabled: true
    storageClass: "nfs-client"